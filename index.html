<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hat Reviewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #app-container {
            width: 100%;
            max-width: 400px;
            height: 650px;
            position: relative;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 20px;
            text-align: center;
            background: #111;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .card-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 85%;
            height: 90%;
            background: #fff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #f9fafb;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: auto;
            color: #1f2937;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card a {
            padding: 12px 24px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
            width: 80%;
        }
        .card a:hover {
            background: #1d4ed8;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }
        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-pass { background: #fee2e2; color: #ef4444; }
        .btn-like { background: #d1fae5; color: #10b981; }
        #summary {
            display: none;
            padding: 20px;
            overflow-y: auto;
            height: 100%;
        }
        #summary h2 { text-align: center; color: #111; }
        .summary-item {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .summary-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 4px;
            background: #f3f4f6;
        }
        .summary-item a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header" id="header-text">Hat Reviewer</div>
    
    <div class="card-container" id="card-container">
        <!-- Cards will be injected here -->
    </div>
    
    <div class="controls" id="controls">
        <button class="btn btn-pass" onclick="handleSwipe(false)">✖</button>
        <button class="btn btn-like" onclick="handleSwipe(true)">♥</button>
    </div>

    <div id="summary">
        <h2>Liked Hats</h2>
        <div id="liked-list"></div>
    </div>
</div>

            url: "https://www.dickssportinggoods.com/p/bad-birdie-mens-sandwich-masters-golf-hat-26badagolfmstrshtsodu/26badagolfmstrshtsodu?color=Pine%20Grove",
            image: "https://dks.scene7.com/is/image/GolfGalaxy/26BADAGOLFMSTRSHTSODU_Pine_Grove?qlt=70&wid=780&hei=780&fmt=webp&op_sharpen=1&fit=constrain"
        },
        { 
            title: "TravisMathew The Patch Floral Baseball Cap", 
            url: "https://www.nordstrom.com/s/the-patch-floral-baseball-cap/7722894?origin=category-personalizedsort&breadcrumb=Home%2FMen%2FAccessories%2FHats&color=444444EYJY",
            image: "https://n.nordstrommedia.com/it/3f2aff45-43fd-46a1-9910-ee52d466b24f.jpeg?w=780&h=1170&crop=pad&dpr=2"
        }
    ];

    let currentIndex = 0;
    const likedHats = [];
    const container = document.getElementById('card-container');

    function renderCard() {
        if (currentIndex >= hats.length) {
            showSummary();
            return;
        }

        const hat = hats[currentIndex];
        const card = document.createElement('div');
        card.className = 'card';
        card.id = 'current-card';
        card.innerHTML = `
            <img src="${hat.image}" alt="${hat.title}" loading="lazy">
            <h2>${hat.title}</h2>
            <a href="${hat.url}" target="_blank">View on Store</a>
        `;
        container.innerHTML = '';
        container.appendChild(card);
    }

    function handleSwipe(liked) {
        if (currentIndex >= hats.length) return;
        
        const card = document.getElementById('current-card');
        card.style.transform = liked ? 'translateX(150%) rotate(20deg)' : 'translateX(-150%) rotate(-20deg)';
        card.style.opacity = '0';

        if (liked) {
            likedHats.push(hats[currentIndex]);
        }

        setTimeout(() => {
            currentIndex++;
            renderCard();
        }, 300);
    }

    function showSummary() {
        document.getElementById('card-container').style.display = 'none';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('header-text').innerText = 'Review Complete';
        
        const summary = document.getElementById('summary');
        const likedList = document.getElementById('liked-list');
        
        summary.style.display = 'block';
        
        if (likedHats.length === 0) {
            likedList.innerHTML = '<p style="text-align:center;">No hats selected.</p>';
            return;
        }

        likedHats.forEach(hat => {
            const item = document.createElement('div');
            item.className = 'summary-item';
            item.innerHTML = `
                <img src="${hat.image}" alt="Thumbnail">
                <a href="${hat.url}" target="_blank">${hat.title}</a>
            `;
            likedList.appendChild(item);
        });
    }

    // Initialize
    renderCard();
</script>

</body>
</html>
